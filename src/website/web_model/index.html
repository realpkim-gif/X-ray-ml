<!doctype html>
<!-- Test page for radiant.js: the fracture model running in the browser, no server.
     Run it from the PROJECT folder:   python -m http.server 8080
     then open http://localhost:8080/website/web_model/index.html
     (opening the file by double-click won't work: browsers block loading the models from file://) -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radiant Fracture Check</title>
    <style>
        :root { --bg: #ffffff; --text: #1f2328; --muted: #59636e; --line: #d1d9e0; --accent: #0969da; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --text: #e6edf3; --muted: #9198a1; --line: #3d444d; --accent: #4493f8; } }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
        main { max-width: 760px; margin: 0 auto; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
        #status { color: var(--muted); }
        .view-button[aria-pressed="true"] { outline: 2px solid var(--accent); font-weight: 600; }

        /* the viewer: 3 pictures of the same size stacked on top of each other */
        #viewer { position: relative; max-width: 100%; border: 1px solid var(--line); }
        #viewer img { display: block; width: 100%; height: auto; }
        #viewer .layer { position: absolute; top: 0; left: 0; }   /* heatmap and box lie exactly on the X-ray */
        [hidden] { display: none !important; }                     /* "hidden" must win over display: flex/block */
    </style>
    <!-- 1. onnxruntime-web: runs ONNX models in the browser -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
    <!-- 2. our pipeline -->
    <script src="radiant.js"></script>
</head>
<body>
<main>
    <h1>Radiant fracture check</h1>
    <p id="status">Loading the model (first time ~300 MB, then cached)...</p>

    <div class="controls">
        <input type="file" id="xray" accept="image/*">
        <button id="analyse" disabled>Analyze</button>
    </div>

    <p id="answer"></p>
    <button id="still-run" hidden>Still run</button>

    <!-- view buttons: switch instantly, the model does NOT run again -->
    <div class="controls" id="view-buttons" hidden>
        <button class="view-button" data-view="both" aria-pressed="true">Box + heatmap</button>
        <button class="view-button" data-view="box" aria-pressed="false">Box</button>
        <button class="view-button" data-view="heatmap" aria-pressed="false">Heatmap</button>
    </div>

    <!-- below the buttons: the X-ray with the heatmap layer and the box layer on top -->
    <div id="viewer" hidden>
        <img id="xray-layer" alt="the uploaded X-ray">
        <img id="heatmap-layer" class="layer" alt="">
        <img id="box-layer" class="layer" alt="">
    </div>
</main>
<script>
    // load the models once when the page opens
    Radiant.load("./").then(function () {
        document.querySelector("#status").textContent = "Model ready. Pick an X-ray.";
        document.querySelector("#analyse").disabled = false;
    }).catch(function (error) {
        document.querySelector("#status").textContent = "Could not load the model: " + error;
    });

    function showView(view) {
        // view = "both", "box" or "heatmap": just show / hide the layers (instant)
        document.querySelector("#heatmap-layer").hidden = (view === "box");
        document.querySelector("#box-layer").hidden = (view === "heatmap");
        const buttons = document.querySelectorAll(".view-button");
        for (let i = 0; i < buttons.length; i++) {
            if (buttons[i].dataset.view === view) {
                buttons[i].setAttribute("aria-pressed", "true");
            } else {
                buttons[i].setAttribute("aria-pressed", "false");
            }
        }
    }

    async function run(stillRun) {
        // stillRun = true when the user clicked "Still run" after the gate said "not an X-ray"
        const file = document.querySelector("#xray").files[0];
        if (!file) return;
        document.querySelector("#still-run").hidden = true;
        document.querySelector("#view-buttons").hidden = true;
        document.querySelector("#viewer").hidden = true;
        document.querySelector("#status").textContent = "Analyzing (can take 10-30 seconds)...";
        const started = performance.now();
        const result = await Radiant.analyse(file, "both", stillRun);
        const seconds = ((performance.now() - started) / 1000).toFixed(1);
        document.querySelector("#status").textContent = `Done in ${seconds} s.`;

        if (result.gate === "not_xray") {
            // the gate thinks it's not an X-ray: ask before running the big model
            document.querySelector("#answer").textContent =
                `${result.message} (X-ray chance ${Math.round(result.xray_chance * 100)}%)`;
            document.querySelector("#still-run").hidden = false;
            return;
        }

        document.querySelector("#answer").textContent =
            `${result.answer} (${Math.round(result.confidence * 100)}% confident, ${result.fracture_votes} votes). ${result.disclaimer}`;

        // put the 3 layers in the viewer (a "normal" answer has no box layer)
        document.querySelector("#xray-layer").src = result.layers.xray;
        document.querySelector("#heatmap-layer").src = result.layers.heatmap;
        if (result.layers.box !== null) {
            document.querySelector("#box-layer").src = result.layers.box;
        } else {
            document.querySelector("#box-layer").removeAttribute("src");
        }
        document.querySelector("#view-buttons").hidden = false;
        document.querySelector("#viewer").hidden = false;
        showView("both");
    }

    document.querySelector("#analyse").addEventListener("click", function () { run(false); });
    document.querySelector("#still-run").addEventListener("click", function () { run(true); });
    const viewButtons = document.querySelectorAll(".view-button");
    for (let i = 0; i < viewButtons.length; i++) {
        viewButtons[i].addEventListener("click", function () { showView(viewButtons[i].dataset.view); });
    }
</script>
</body>
</html>
